<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cc-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f9a8d4" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- easel legs -->
  <path d="M20 58 L32 22 L44 58" stroke="#c4a882" stroke-width="2" stroke-linecap="round" fill="none" stroke-linejoin="round"/>
  <!-- canvas -->
  <rect x="18" y="10" width="28" height="22" rx="3" fill="url(#cc-wash)" stroke="#b08968" stroke-width="1.8"/>
  <!-- paint strokes on canvas -->
  <path d="M24 18 Q28 14 32 18 Q36 22 38 17" stroke="#e879a0" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M22 24 Q26 26 30 23" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- paintbrush -->
  <path d="M42 8 L48 18" stroke="#b08968" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="42" cy="8" rx="3" ry="4" fill="#f9a8d4" stroke="#e879a0" stroke-width="1" transform="rotate(-20 42 8)"/>
  <!-- sparkle -->
  <circle cx="50" cy="12" r="1.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="14" cy="14" r="1" fill="#a78bfa" opacity="0.5"/>
</svg>
