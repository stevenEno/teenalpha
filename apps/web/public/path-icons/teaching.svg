<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="te-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- open book -->
  <path d="M32 18 Q18 14 8 20 L8 50 Q18 44 32 48 Z" fill="url(#te-wash)" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M32 18 Q46 14 56 20 L56 50 Q46 44 32 48 Z" fill="url(#te-wash)" stroke="#6b7280" stroke-width="1.5"/>
  <!-- spine -->
  <path d="M32 18 L32 48" stroke="#9ca3af" stroke-width="1"/>
  <!-- text lines left page -->
  <path d="M14 28 L28 26" stroke="#9ca3af" stroke-width="1" stroke-linecap="round"/>
  <path d="M14 33 L26 31" stroke="#9ca3af" stroke-width="1" stroke-linecap="round"/>
  <path d="M14 38 L24 36" stroke="#9ca3af" stroke-width="1" stroke-linecap="round"/>
  <!-- text lines right page -->
  <path d="M36 26 L50 28" stroke="#9ca3af" stroke-width="1" stroke-linecap="round"/>
  <path d="M36 31 L48 33" stroke="#9ca3af" stroke-width="1" stroke-linecap="round"/>
  <path d="M36 36 L46 38" stroke="#9ca3af" stroke-width="1" stroke-linecap="round"/>
  <!-- light rays from book -->
  <path d="M32 14 L32 6" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M28 14 L24 8" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <path d="M36 14 L40 8" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- sparkles -->
  <circle cx="32" cy="4" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="20" cy="6" r="1.2" fill="#f9a8d4" opacity="0.5"/>
  <circle cx="44" cy="6" r="1.2" fill="#a78bfa" opacity="0.5"/>
</svg>
