<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="co-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- laptop base -->
  <path d="M8 42 L56 42 L52 46 L12 46 Z" fill="#d1d5db" stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- laptop screen -->
  <rect x="14" y="14" width="36" height="28" rx="3" fill="url(#co-wash)" stroke="#6b7280" stroke-width="1.8"/>
  <!-- code lines -->
  <path d="M20 22 L26 22" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <path d="M22 27 L32 27" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
  <path d="M20 32 L28 32" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <path d="M24 37 L34 37" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
  <!-- leaf growing from laptop -->
  <path d="M44 16 Q48 8 52 12 Q48 10 46 14" fill="#86efac" stroke="#4ade80" stroke-width="1" stroke-linejoin="round"/>
  <path d="M48 10 Q54 4 56 8 Q52 6 50 10" fill="#bbf7d0" stroke="#4ade80" stroke-width="1" stroke-linejoin="round"/>
  <!-- small sparkle -->
  <circle cx="56" cy="6" r="1.2" fill="#fbbf24" opacity="0.6"/>
</svg>
