<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="de-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- palette -->
  <ellipse cx="30" cy="34" rx="20" ry="18" fill="url(#de-wash)" stroke="#d97706" stroke-width="1.8"/>
  <!-- thumb hole -->
  <ellipse cx="22" cy="40" rx="4" ry="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <!-- paint blobs -->
  <circle cx="22" cy="26" r="4" fill="#f87171" stroke="#ef4444" stroke-width="0.8"/>
  <circle cx="32" cy="22" r="3.5" fill="#60a5fa" stroke="#3b82f6" stroke-width="0.8"/>
  <circle cx="40" cy="26" r="3.5" fill="#fbbf24" stroke="#f59e0b" stroke-width="0.8"/>
  <circle cx="42" cy="36" r="3" fill="#4ade80" stroke="#22c55e" stroke-width="0.8"/>
  <circle cx="36" cy="42" r="3" fill="#a78bfa" stroke="#7c3aed" stroke-width="0.8"/>
  <!-- floating shapes -->
  <rect x="50" y="10" width="8" height="8" rx="1" fill="none" stroke="#60a5fa" stroke-width="1.5" transform="rotate(15 54 14)"/>
  <circle cx="8" cy="16" r="4" fill="none" stroke="#f87171" stroke-width="1.5"/>
  <polygon points="54,42 58,50 50,50" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- sparkle -->
  <circle cx="12" cy="8" r="1.2" fill="#fbbf24" opacity="0.6"/>
</svg>
